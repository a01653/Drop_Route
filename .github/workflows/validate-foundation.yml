name: Validate foundation
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  # Datos, auditorías musicales, tests de la base y documentación. Necesita Python 3.10.
  foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.10'
      - run: npm ci --ignore-scripts
      - run: npm run data:check
      - run: npm run audit:music
      - run: npm run test:base
      - run: npm run docs:check
  # Aplicación: tipos, lint, Vitest, build y E2E con Chromium sobre el build recién generado.
  app:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:unit
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      # Capturas reales para los manuales (DR-007): comando explícito sobre un build propio y su preview en un puerto libre.
      # DROP_ROUTE_CAPTURE_OUTPUT aísla el destino: la CI nunca sobrescribe las capturas versionadas de los manuales
      # (entradas de los PDF); las preguntas y el commit cambian en cada ejecución.
      - run: npm run docs:captures
        env:
          DROP_ROUTE_CAPTURE_OUTPUT: test-results/manual-captures
      - uses: actions/upload-artifact@v7
        with:
          name: drop-route-manual-captures
          path: |
            test-results/manual-captures/*.png
            test-results/manual-captures/capturas.json
          if-no-files-found: error
