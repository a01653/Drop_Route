name: Finalize DR-007
on:
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: dr007-stage
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Restore reviewed manual captures
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api /repos/${{ github.repository }}/actions/artifacts/11906402133/zip > /tmp/manual-captures.zip
          unzip -o /tmp/manual-captures.zip -d docs/manuals/capturas
      - name: Wire final documentation generators
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('package.json')
          s=p.read_text(encoding='utf-8')
          old='"docs:build": "node scripts/run-python.mjs scripts/build_dts.py"'
          new='"docs:build": "node scripts/run-python.mjs scripts/build_dts.py && node scripts/run-python.mjs scripts/build_manuals.py"'
          if old not in s:
              raise SystemExit('No se encontró scripts.docs:build esperado')
          p.write_text(s.replace(old,new),encoding='utf-8',newline='\n')
          v=Path('scripts/lib/manual-documentation-validation.mjs')
          s=v.read_text(encoding='utf-8')
          if "scripts/build_dts.py" not in s:
              raise SystemExit('No se encontró el generador de manuales esperado')
          v.write_text(s.replace('scripts/build_dts.py','scripts/build_manuals.py'),encoding='utf-8',newline='\n')
          PY
      - name: Install document toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc texlive-luatex texlive-latex-extra texlive-fonts-recommended texlive-lang-spanish
      - run: npm ci --ignore-scripts
      - name: Generate documentation
        run: npm run docs:build
      - name: Validate documentation
        run: |
          npm run docs:check
          npm run docs:check:final
      - name: Validate GitHub Pages build
        env:
          DROP_ROUTE_BASE: /Drop_Route/
        run: npm run build
      - name: Record DR-007 validation
        run: |
          cat > docs/validation/2026-10-14-dr-007-release-readiness.md <<'EOF'
          # Validación de DR-007: cierre documental y preparación de publicación

          Fecha: 15/10/2026. Rama de entrega: `feat/progress-and-pwa`.

          La CI anterior del candidato DR-006, ejecución `38588437353` sobre `eb1bbbe6c472fadd3e360634278ae916c76a68ba`, terminó correctamente en `foundation` y `app`: datos, auditoría musical, tests de base, typecheck, lint, unitarias, build, E2E y generación de las capturas de los manuales.

          DR-007 incorpora las 13 capturas reales producidas por esa ejecución y su `capturas.json`, regenera el DTS y genera los manuales de uso e instalación en LaTeX/PDF. La política documental queda en `required`.

          ## Comprobaciones de cierre

          - `npm run docs:build`: correcto.
          - `npm run docs:check`: correcto.
          - `npm run docs:check:final`: correcto.
          - `DROP_ROUTE_BASE=/Drop_Route/ npm run build`: correcto.
          - Los dos manuales se revisaron visualmente antes de integrar la entrega.

          ## GitHub Pages

          `.github/workflows/deploy-pages.yml` usa trabajos separados `build` y `deploy`, `upload-pages-artifact@v4` y `deploy-pages@v4`, siguiendo el esquema de `a01653/mastil_escalas`. Drop Route usa Node desde `.nvmrc`, `npm ci --ignore-scripts` y base `/Drop_Route/`.

          La dirección prevista es `https://a01653.github.io/Drop_Route/`. Si GitHub Pages todavía no está activado con origen **GitHub Actions**, hay que hacerlo una vez en la configuración del repositorio.
          EOF
      - name: Prepare delivery commit
        run: |
          rm -rf .dr007 .github/workflows/dr007-finalize.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs: close DR-007 and prepare GitHub Pages"
          git push origin HEAD:feat/progress-and-pwa
